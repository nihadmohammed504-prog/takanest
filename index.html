<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TakaNest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;background:#0b1220;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:430px;margin:auto}
.header{padding:8px 4px 16px;text-align:center}
.logo{font-size:31px;font-weight:800;color:#38bdf8}
.sub{color:#94a3b8;margin-top:5px}
.card{background:#18243a;border:1px solid #263653;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
h2{margin:0 0 8px}
p{color:#aebbd0;line-height:1.55}
.balance{text-align:center;background:#0f172a;border-radius:18px;padding:16px;margin:16px 0}
.amount{font-size:31px;font-weight:800;color:#22c55e;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;border:0;border-radius:14px;padding:15px;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#16a34a}
.blue{background:#0284c7}
.gold{background:#d97706}
.dark{background:#334155}
button:disabled{opacity:.55}
.status{min-height:22px;text-align:center;color:#fbbf24;margin-top:13px;white-space:pre-line}
.game{display:none;text-align:center}
.coin{width:150px;height:150px;margin:20px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f59e0b;box-shadow:0 8px 25px rgba(245,158,11,.35);font-size:54px;user-select:none;touch-action:manipulation;cursor:pointer}
.score{font-size:24px;font-weight:800}
.timer{color:#fbbf24;margin-top:6px}
.small{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">🎁 TakaNest</div>
    <div class="sub">Play • Bonus • Earn</div>
  </div>

  <div class="card">
    <div class="balance">
      <div class="small">Session reward</div>
      <div class="amount" id="balance">৳0.00</div>
    </div>

    <div class="grid">
      <button class="primary" onclick="openGame()">🎮 Play Game</button>
      <button class="gold" onclick="dailyBonus()">🎁 Daily Bonus</button>
      <button class="blue" onclick="optionalAd()">📺 Watch Ad</button>
      <button class="dark" onclick="tg.close()">✕ Close</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card game" id="game">
    <h2>🎮 Tap Coin</h2>
    <p>৩০ সেকেন্ডে যত বেশি coin tap করবেন, game complete হবে।</p>
    <div class="score">Score: <span id="score">0</span></div>
    <div class="timer">Time: <span id="timer">30</span>s</div>
    <div class="coin" id="coin">🪙</div>
    <button class="dark" onclick="closeGame()">Back</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const BLOCK_ID = "47024";
let AdController = null;
try { AdController = window.Adsgram.init({blockId: BLOCK_ID}); } catch(e) {}

let sessionReward = 0;
let gameRunning = false;
let score = 0;
let seconds = 30;
let timer = null;

function status(t){document.getElementById("status").innerText=t}
function updateBalance(x){
  sessionReward += x;
  document.getElementById("balance").innerText="৳"+sessionReward.toFixed(2);
}
function eventId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
}
function send(action){
  try{
    tg.sendData(JSON.stringify({
      action:action,
      event_id:eventId(),
      timestamp:Date.now()
    }));
  }catch(e){status("❌ Reward পাঠানো যায়নি।")}
}

async function showRewardedAd(afterAction, loadingText){
  if(!AdController){
    status("❌ Ads system এখনো load হয়নি।");
    return false;
  }
  status(loadingText || "অ্যাড লোড হচ্ছে...");
  try{
    const result=await AdController.show();
    if(result && result.done===true && result.error!==true){
      afterAction();
      return true;
    }
    status("⚠️ Ad সম্পূর্ণ হয়নি।");
    return false;
  }catch(e){
    status("❌ Ad চালু করা যায়নি। আবার চেষ্টা করুন।");
    return false;
  }
}

async function dailyBonus(){
  await showRewardedAd(()=>{
    status("✅ Ad সম্পূর্ণ হয়েছে!\nDaily Bonus claim হচ্ছে...");
    send("daily_bonus");
  },"🎁 Daily Bonus-এর জন্য Ad লোড হচ্ছে...");
}

async function optionalAd(){
  await showRewardedAd(()=>{
    status("✅ Ad সম্পূর্ণ হয়েছে!\nReward processing...");
    send("ad_reward");
  },"📺 Optional Ad লোড হচ্ছে...");
}

function openGame(){
  document.getElementById("game").style.display="block";
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  startGame();
}
function closeGame(){
  stopGame();
  document.getElementById("game").style.display="none";
}
function startGame(){
  stopGame();
  score=0; seconds=30; gameRunning=true;
  document.getElementById("score").innerText=score;
  document.getElementById("timer").innerText=seconds;
  status("🎮 Game চলছে...");
  timer=setInterval(()=>{
    seconds--;
    document.getElementById("timer").innerText=seconds;
    if(seconds<=0) finishGame();
  },1000);
}
function stopGame(){
  if(timer) clearInterval(timer);
  timer=null;
  gameRunning=false;
}
function finishGame(){
  if(!gameRunning) return;
  stopGame();
  status("⏳ Game complete — reward processing...");
  // The server decides the actual reward and daily limit.
  send("game_complete");
}
document.getElementById("coin").addEventListener("click",()=>{
  if(!gameRunning) return;
  score++;
  document.getElementById("score").innerText=score;
});
</script>
</body>
</html>
