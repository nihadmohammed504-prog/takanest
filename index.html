<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TakaNest Ad Reward</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0f172a;
            color: white;

            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 380px;

            background: #1e293b;

            padding: 30px 24px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;

            color: #38bdf8;
        }

        .description {
            color: #94a3b8;

            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 20px;
        }

        .balance {
            background: #0f172a;

            border-radius: 14px;

            padding: 15px;

            margin-bottom: 20px;
        }

        .balance-title {
            color: #94a3b8;
            font-size: 13px;
        }

        .balance-amount {
            margin-top: 5px;

            font-size: 25px;
            font-weight: bold;

            color: #22c55e;
        }

        .btn {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #22c55e,
                #16a34a
            );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(34, 197, 94, 0.35);

            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #475569;

            cursor: not-allowed;

            box-shadow: none;
        }

        .status {
            min-height: 22px;

            margin-top: 15px;

            color: #fbbf24;

            font-size: 14px;

            line-height: 1.5;
        }
    </style>

</head>

<body>

<div class="card">

    <h2>🎁 TakaNest Reward</h2>

    <div class="description">
        ভিডিও অ্যাডটি সম্পূর্ণ দেখুন এবং
        আপনার রিওয়ার্ড সংগ্রহ করুন।
    </div>

    <div class="balance">

        <div class="balance-title">
            এই Ad-এর Reward
        </div>

        <div
            class="balance-amount"
            id="balance">
            ৳0.00
        </div>

    </div>

    <button
        class="btn"
        id="ad-btn"
        onclick="showAd()">

        ▶ Watch Video Ad

    </button>

    <div
        class="status"
        id="status">
    </div>

</div>


<script>

    // =====================================================
    // TELEGRAM MINI APP
    // =====================================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // =====================================================
    // ADSGRAM
    // =====================================================

    let AdController = null;

    try {

        AdController = window.Adsgram.init({
            blockId: "47024"
        });

        console.log(
            "Adsgram initialized successfully."
        );

    } catch (error) {

        console.error(
            "Adsgram initialization error:",
            error
        );

    }


    // =====================================================
    // SESSION DISPLAY
    // =====================================================

    let sessionReward = 0;


    function updateBalance(amount) {

        sessionReward += amount;

        document.getElementById(
            "balance"
        ).innerText =
            "৳" + sessionReward.toFixed(2);

    }


    // =====================================================
    // CREATE UNIQUE EVENT ID
    // =====================================================

    function createEventId() {

        try {

            if (
                window.crypto &&
                typeof crypto.randomUUID === "function"
            ) {

                return crypto.randomUUID();

            }

        } catch (error) {

            console.log(
                "UUID unavailable"
            );

        }


        return (
            Date.now().toString(36) +
            "-" +
            Math.random()
                .toString(36)
                .substring(2) +
            "-" +
            Math.random()
                .toString(36)
                .substring(2)
        );

    }


    // =====================================================
    // SEND REWARD EVENT TO BOT
    // =====================================================

    function sendRewardEvent() {

        try {

            const data = {

                action: "ad_reward",

                event_id: createEventId(),

                timestamp: Date.now()

            };


            console.log(
                "Sending reward event:",
                data
            );


            tg.sendData(
                JSON.stringify(data)
            );


        } catch (error) {

            console.error(
                "Telegram sendData error:",
                error
            );


            const status =
                document.getElementById(
                    "status"
                );


            status.innerText =
                "❌ Reward পাঠানো যায়নি। আবার চেষ্টা করুন।";

        }

    }


    // =====================================================
    // SHOW ADSGRAM REWARDED AD
    // =====================================================

    async function showAd() {

        const button =
            document.getElementById(
                "ad-btn"
            );


        const status =
            document.getElementById(
                "status"
            );


        // -------------------------------------------------
        // CHECK ADSGRAM
        // -------------------------------------------------

        if (!AdController) {

            status.innerText =
                "❌ Ads system লোড হয়নি।";

            return;

        }


        // -------------------------------------------------
        // PREVENT DOUBLE CLICK
        // -------------------------------------------------

        button.disabled = true;

        button.innerText =
            "⏳ Loading Ad...";


        status.innerText =
            "অ্যাড লোড হচ্ছে, অপেক্ষা করুন...";


        try {

            // -------------------------------------------------
            // SHOW AD
            // -------------------------------------------------

            const result =
                await AdController.show();


            console.log(
                "Adsgram result:",
                result
            );


            // -------------------------------------------------
            // ONLY AFTER COMPLETION
            // -------------------------------------------------

            if (
                result &&
                result.done === true &&
                result.error !== true
            ) {

                status.innerText =
                    "✅ Ad সম্পূর্ণ হয়েছে!\nReward processing...";


                // Send reward event to Telegram bot
                sendRewardEvent();


            } else {

                status.innerText =
                    "⚠️ Ad সম্পূর্ণ হয়নি। Reward দেওয়া হয়নি।";


                button.disabled = false;

                button.innerText =
                    "▶ Watch Video Ad";

            }


        } catch (error) {

            console.error(
                "Adsgram error:",
                error
            );


            status.innerText =
                "❌ Ad চালু করা যায়নি। আবার চেষ্টা করুন।";


            button.disabled = false;

            button.innerText =
                "▶ Watch Video Ad";

        }

    }

</script>

</body>

</html>
