<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakaNest Ad Reward</title>
    <!-- Telegram Mini App Library -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK Library -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>🎁 TakaNest Reward</h2>
    <p>ভিডিও অ্যাড সম্পূর্ণ দেখে রিওয়ার্ড ক্লেইম করুন।</p>
    <button class="btn" id="ad-btn" onclick="showAd()">Watch Video Ad</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Apnar Adsgram Block ID ekhane shothikbhabe boshano ache
        const AdController = window.Adsgram.init({ blockId: "49354" });

        function showAd() {
            AdController.show().then((result) => {
                alert("ধন্যবাদ! অ্যাড দেখা সম্পন্ন হয়েছে।");
                tg.close();
            }).catch((result) => {
                alert("অ্যাড পুরোপুরি দেখা হয়নি বা কোনো ত্রুটি হয়েছে।");
            });
        }
    </script>
</body>
</html>
